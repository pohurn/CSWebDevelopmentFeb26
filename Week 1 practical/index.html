<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="./css/firstpage.css"> <!-- this is how we link external css -->
</head>
<body>

    <div class="card">
        <img src="C:\Users\User\Pictures\fr.jpg" alt="Profile Picture">
        <h1 id="studentName">FARHAAN</h1>
        <h3>Computer Science Student</h3>

        <p>
            Hello! I am learning HTML, CSS and JavaScript.

        </p>

    <script src="./js/script.js"></script>

</html>
